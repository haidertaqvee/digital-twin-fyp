name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, sos-hackathon ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp -r demo/* _site/
          mkdir -p _site/demo
          cp -r demo/* _site/demo/
          mkdir -p _site/data/processed/demo_tiles
          cp -r data/processed/demo_tiles/* _site/data/processed/demo_tiles/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
